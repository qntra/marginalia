name: publish

# push markdown to main -> the site rebuilds and ships itself. that's the
# whole publishing pipeline. no cms, no admin panel, no button to click.
on:
  push:
    branches: [main]
    paths:
      - 'notes/**'
      - 'research/**'
      - 'writing/**'
      - 'logs/**'
      - 'marginalia.quantara.cv/**'
      - 'publish/**'
      - 'soul.md'
      - 'backlog.md'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

# two pushes in a row shouldn't race each other into the same docroot
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build.py dates entries by when they first landed in git, so it
          # needs the actual history, not a shallow clone
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install
        run: pip install -r publish/requirements.txt

      - name: build
        run: python publish/build.py

      # the key can only rrsync into the docroot (pinned server-side), and the
      # host key is pinned here too so a swapped box can't eat the deploy
      - name: ssh
        env:
          DEPLOY_KEY: ${{ secrets.MARGINALIA_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.MARGINALIA_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/marginalia_deploy
          chmod 600 ~/.ssh/marginalia_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'EOF'
          Host marginalia-origin
            HostName 64.181.212.228
            User marginalia-deploy
            IdentityFile ~/.ssh/marginalia_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: deploy
        run: python publish/deploy.py
